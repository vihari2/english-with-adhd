<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Images/favicon.png">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0;">
    <div class="auth-panel">
        <div class="auth-box">
            <h3>Sign In</h3>
            <form id="auth-form" class="auth-form">
                <input id="email-input" type="email" placeholder="your@email.com" required>
                <input id="password-input" type="password" placeholder="Password" required>
                <div class="auth-actions">
                    <button type="submit" id="auth-submit">Enter</button>
                    <button type="button" id="auth-signup" class="secondary" onclick="signUpWithEmail()">Create account</button>
                </div>
            </form>
            <p style="font-size: 0.85em; color: #666; text-align: center; margin-top: 15px;">
                💡 If you do not have an account, enter your email and password and click <strong>"Create account"</strong>
            </p>
            <p id="auth-status" class="auth-status"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/pomodoro.js"></script>
    <script src="js/flashcards.js"></script>
    <script src="js/speaking.js"></script>
    <script src="js/journal.js"></script>
    <script src="js/coursebook.js"></script>
    <script src="js/otherResources.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
